    <style>

            font-family: 'EnkaLocalFont';
            src: url('./fonts/59314.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --enka-ink: #201915;
            --enka-muted: #6c5d50;
            --enka-paper: #fffaf2;
            --enka-card: rgba(255, 252, 246, 0.92);
            --enka-brown: #4d2f1c;
            --enka-amber: #c9842f;
            --enka-line: rgba(77, 47, 28, 0.14);
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'EnkaLocalFont', 'YourLocalFontName', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(201, 132, 47, 0.14), transparent 34rem),
                linear-gradient(180deg, #f9f5ed 0%, #f6f1e8 48%, #fffaf2 100%);
            color: var(--enka-ink);
        }
        .section-card {
            background: var(--enka-card);
            border: 1px solid var(--enka-line);
            border-radius: 8px;
            box-shadow: 0 18px 48px rgba(53, 35, 20, 0.08);
            padding: 1.5rem;
        }
        .menu-page-header {
            background: linear-gradient(135deg, #2a1d16, #5b3519);
        }
        .menu-nav a {
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            padding: 0.48rem 0.82rem;
            background: rgba(255,255,255,0.08);
            transition: background 0.2s ease, color 0.2s ease;
        }
        .menu-nav a:hover {
            background: #fffaf2;
            color: #4d2f1c;
        }
        .menu-hero {
            background:
                linear-gradient(120deg, rgba(32,25,21,0.88), rgba(77,47,28,0.72)),
                url('./images/mini-hero.jpg') center/cover;
            color: #fff;
        }
        .section-label {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--enka-amber);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.14em;
        }
        .menu-section-title {
            line-height: 1.25;
            letter-spacing: 0.02em;
        }
        .grid-item {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: baseline;
        }
        .price {
            white-space: nowrap;
            color: #5b3519;
            font-weight: 700;
        }
        #loader {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loader.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        #loader img {
            width: 9rem;
            height: 9rem;
            filter: drop-shadow(0 18px 24px rgba(60, 39, 19, 0.28));
            transform: translateY(-4px);
        }
        .loader-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
        }
        .loader-track {
            width: min(18rem, 58vw);
            height: 8px;
            overflow: hidden;
            border-radius: 999px;
            background: #d7c4aa;
            box-shadow: inset 0 1px 2px rgba(68, 45, 24, 0.22);
        }
        .loader-bar {
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #5b3519, #8a541f, #b8792b);
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.7s cubic-bezier(0.65, 0, 0.35, 1);
            box-shadow: 0 0 14px rgba(138, 84, 31, 0.38);
        }
        .loader-credit {
            color: rgba(77, 47, 28, 0.52);
            font-size: 0.78rem;
            letter-spacing: 0.16em;
        }
        main {
            opacity: 1;
            transition: opacity 0.6s ease;
        }
        main.content-visible {
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="loader">
        <div class="loader-inner" aria-label="Loading">
            <img src="./images/load.png" alt="loading logo">
            <div class="loader-track" aria-hidden="true">
                <div id="loader-bar" class="loader-bar"></div>
            </div>
            <p class="loader-credit">site by rintaro</p>
        </div>
    </div>
    <header class="menu-page-header text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between gap-6">
            <a href="index.html" class="flex items-center space-x-3">
                <img src="./images/load.png" alt="enka logo" class="h-10 w-10">
                <div>
                    <p class="text-sm uppercase tracking-widest">Cafe & Baru</p>
                    <p class="text-xl font-semibold">enka</p>
                </div>
            </a>
            <nav id="menu-nav" class="menu-nav hidden md:flex gap-2 text-sm tracking-wide">
                <a href="#lunch" class="hover:text-amber-200">ランチ</a>
                <a href="#dolce" class="hover:text-amber-200">スイーツ</a>
                <a href="#drink" class="hover:text-amber-200">ドリンク</a>
                <a href="#alcohol" class="hover:text-amber-200">お酒</a>
                <a href="#dinner" class="hover:text-amber-200">ディナー</a>
                <a href="#takeaway" class="hover:text-amber-200">テイクアウト</a>
            </nav>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-10 space-y-10">
        <section class="menu-hero section-card overflow-hidden">
            <div class="max-w-3xl">
                <p class="text-sm text-amber-200 font-semibold tracking-[0.18em]">ENKA MENU</p>
                <h1 class="text-3xl md:text-5xl font-bold mt-3 leading-tight">ランチも、夜のバルも、テイクアウトも</h1>
                <p class="text-white/82 mt-5 leading-relaxed">ランチはパニーニやニョッキを中心に、夜は燻製料理とお酒もお楽しみいただけます。ドリンク・スイーツ・アルコールは昼夜共通です。</p>
                <p class="text-xs text-white/65 mt-4">※表示価格は税込です。仕入れ状況により内容が変わる場合があります。</p>
            </div>

                <a href="#lunch" class="rounded-full bg-white text-stone-900 px-4 py-2 font-semibold">ランチ</a>
                <a href="#drink" class="rounded-full bg-white/12 border border-white/25 px-4 py-2">ドリンク</a>

                メニューを読み込んでいます。
            </section>
        </div>
    </main>

    <footer class="bg-stone-900 text-stone-200 py-10 mt-6">
        <div class="max-w-6xl mx-auto px-6 text-center space-y-3">
            <p class="text-lg font-semibold tracking-widest">enka</p>
            <p class="text-xs text-stone-400">&copy; 2025 Cafe &amp; Baru enka</p>
        </div>
    </footer>
    <script src="./assets/js/menu.bundle.js" defer></script>
    <script>
        function showMenuContent() {
            const loader = document.getElementById('loader');
            const loaderBar = document.getElementById('loader-bar');
            const main = document.querySelector('main');

            if (loaderBar) {
                loaderBar.style.transform = 'scaleX(0.18)';
                requestAnimationFrame(() => {
                    loaderBar.style.transform = 'scaleX(0.9)';
                });
            }

            setTimeout(() => {
                if (loaderBar) {
                    loaderBar.style.transform = 'scaleX(1)';
                }
                if (loader) {
                    loader.classList.add('fade-out');
                    loader.style.opacity = '0';
                    loader.style.visibility = 'hidden';
                    setTimeout(() => {
                        loader.style.display = 'none';
                    }, 650);
                }
                main?.classList.add('content-visible');
            }, 650);
        }

        window.addEventListener('load', showMenuContent);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(showMenuContent, 1200);
            });
        } else {
            setTimeout(showMenuContent, 1200);
        }
    </script>
</body>
</html>
